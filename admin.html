<!DOCTYPE html><html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExceptionalApartment Admin Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 30px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    h1 { color: #173b2b; }
    form, .property {
      background: white;
      padding: 18px;
      margin: 15px 0;
      border-radius: 8px;
    }
    input, textarea, button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
    }
    button {
      background: #173b2b;
      color: white;
      border: 0;
      cursor: pointer;
      border-radius: 5px;
    }
    .delete { background: #a52a2a; }
    #dashboard { display: none; }
    #message { font-weight: bold; }
  </style>
</head>
<body>
  <h1>ExceptionalApartment</h1>
  <p>Private Property Management</p>  <section id="login">
    <h2>Admin Login</h2>
    <form id="login-form">
      <input id="email" type="email" placeholder="Admin email" required>
      <input id="password" type="password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>
    <p id="login-message" role="status"></p>
  </section>  <section id="dashboard">
    <h2>Add a Rental Property</h2>
    <form id="property-form">
      <input id="title" placeholder="Property title" required>
      <input id="country" placeholder="Country (USA, UK, Jersey...)" required>
      <input id="city" placeholder="City or area" required>
      <input id="rent" type="number" min="0" step="0.01" placeholder="Monthly rent" required>
      <input id="bedrooms" type="number" min="0" placeholder="Bedrooms" required>
      <input id="bathrooms" type="number" min="0" step="0.5" placeholder="Bathrooms" required>
      <textarea id="description" placeholder="Property description" required></textarea>
      <input id="image_url" type="url" placeholder="Image URL (optional)">
      <button type="submit">Add Property</button>
    </form><p id="property-message" role="status"></p>
<h2>Your Properties</h2>
<div id="properties"></div>
<button id="logout" type="button">Log Out</button>

  </section>  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>  <script>
    const SUPABASE_URL = "https://luccfzezhqcnttclhcjc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_LYsDZp2mNWgC2j3dDMihHw_bfc3Y-u1";

    const supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );

    const adminEmail = "akinyemiakintunde07@gmail.com";

    async function checkLogin() {
      const { data: { session } } = await supabaseClient.auth.getSession();

      if (session && session.user.email === adminEmail) {
        document.getElementById("login").style.display = "none";
        document.getElementById("dashboard").style.display = "block";
        loadProperties();
      } else {
        document.getElementById("login").style.display = "block";
        document.getElementById("dashboard").style.display = "none";
      }
    }

    document.getElementById("login-form").addEventListener("submit", async function(event) {
      event.preventDefault();
      const message = document.getElementById("login-message");
      message.textContent = "Logging in...";

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });

      if (error) {
        message.textContent = "Login failed. Check your email and password.";
        return;
      }

      if (data.user.email !== adminEmail) {
        await supabaseClient.auth.signOut();
        message.textContent = "This account is not an administrator.";
        return;
      }

      await checkLogin();
    });

    document.getElementById("property-form").addEventListener("submit", async function(event) {
      event.preventDefault();
      const message = document.getElementById("property-message");
      message.textContent = "Saving property...";

      const property = {
        title: document.getElementById("title").value.trim(),
        country: document.getElementById("country").value.trim(),
        city: document.getElementById("city").value.trim(),
        rent: Number(document.getElementById("rent").value),
        bedrooms: Number(document.getElementById("bedrooms").value),
        bathrooms: Number(document.getElementById("bathrooms").value),
        description: document.getElementById("description").value.trim(),
        image_url: document.getElementById("image_url").value.trim() || null,
        available: true
      };

      const { error } = await supabaseClient
        .from("properties")
        .insert(property);

      if (error) {
        message.textContent = "Could not save property: " + error.message;
        return;
      }

      message.textContent = "Property added successfully!";
      this.reset();
      loadProperties();
    });

    async function loadProperties() {
      const container = document.getElementById("properties");
      container.textContent = "Loading properties...";

      const { data, error } = await supabaseClient
        .from("properties")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        container.textContent = "Could not load properties: " + error.message;
        return;
      }

      container.replaceChildren();

      if (!data.length) {
        container.textContent = "No properties added yet.";
        return;
      }

      data.forEach(property => {
        const card = document.createElement("div");
        card.className = "property";

        const title = document.createElement("h3");
        title.textContent = property.title;

        const details = document.createElement("p");
        details.textContent = property.city + ", " + property.country +
          " | Rent: " + property.rent +
          " | Bedrooms: " + property.bedrooms +
          " | Bathrooms: " + property.bathrooms;

        const description = document.createElement("p");
        description.textContent = property.description;

        card.append(title, details, description);

        const deleteButton = document.createElement("button");
        deleteButton.textContent = "Delete Property";
        deleteButton.className = "delete";
        deleteButton.addEventListener("click", async () => {
          if (!confirm("Are you sure you want to delete this property?")) return;

          const { error } = await supabaseClient
            .from("properties")
            .delete()
            .eq("id", property.id);

          if (error) {
            alert("Delete failed: " + error.message);
          } else {
            loadProperties();
          }
        });

        card.appendChild(deleteButton);
        container.appendChild(card);
      });
    }

    document.getElementById("logout").addEventListener("click", async () => {
      await supabaseClient.auth.signOut();
      await checkLogin();
    });

    checkLogin();
  </script></body>
  </html>
